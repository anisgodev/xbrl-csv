name: Release

# Push a tag vX.Y.Z: publishes io.anisgodev.tech:xbrl-csv:X.Y.Z to Maven Central and creates the GitHub Release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          server-id: central
          server-username: CENTRAL_TOKEN_USERNAME
          server-password: CENTRAL_TOKEN_PASSWORD
      - name: Set version from tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          mvn -B -q org.codehaus.mojo:versions-maven-plugin:2.23.0:set -DnewVersion="$version" -DgenerateBackupPoms=false
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Build, sign and publish to Maven Central
        run: mvn -B -Prelease deploy
        env:
          CENTRAL_TOKEN_USERNAME: ${{ secrets.CENTRAL_TOKEN_USERNAME }}
          CENTRAL_TOKEN_PASSWORD: ${{ secrets.CENTRAL_TOKEN_PASSWORD }}
          MAVEN_GPG_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
      - name: Create GitHub Release
        run: |
          gh release create "$GITHUB_REF_NAME" --title "xbrl-csv $VERSION" --generate-notes \
            target/xbrl-csv-$VERSION.jar target/xbrl-csv-$VERSION-sources.jar target/xbrl-csv-$VERSION-javadoc.jar
        env:
          GH_TOKEN: ${{ github.token }}
